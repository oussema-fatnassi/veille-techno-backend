services:
  postgres:
    image: postgres:17-alpine
    container_name: veille_kanban_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: veille_kanban
    ports:
      - "5433:5432"
    volumes:
      - veille_kanban_pgdata:/var/lib/postgresql/data

volumes:
  veille_kanban_pgdata: